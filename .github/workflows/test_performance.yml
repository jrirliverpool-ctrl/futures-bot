name: Performance Unit Tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/performance.py'
      - 'scripts/backtest.py'
      - 'scripts/paper_engine.py'
      - 'scripts/strategy.py'
      - 'scripts/indicators.py'
      - 'scripts/strategy_config.py'
      - 'scripts/compute_hash.py'
      - 'tests/test_performance.py'
      - '.github/workflows/test_performance.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Performance tests
        run: python tests/test_performance.py