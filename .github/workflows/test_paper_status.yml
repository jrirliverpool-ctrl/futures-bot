name: Test Paper Status and Reconcile

on:
  workflow_dispatch:

jobs:
  paper_status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Run paper_status tests
        run: python tests/test_paper_status.py

  reconcile_with_data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Run reconcile_with_data tests
        run: python tests/test_reconcile_with_data.py

  state_hash_strict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Run state hash strict tests
        run: python tests/test_state_hash_strict.py

  strategy_hash_contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Run strategy hash contract tests
        run: python tests/test_strategy_hash_contract.py