name: Test Paper Status

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Run paper_status tests
        run: python tests/test_paper_status.py
      - name: Run reconcile_with_data tests
        run: python tests/test_reconcile_with_data.py