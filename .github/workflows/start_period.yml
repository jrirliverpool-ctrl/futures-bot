
name: Start New Evaluation Period

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apexquant-mock-live
  cancel-in-progress: false

jobs:
  start-period:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests

      - name: Run Period Safety Tests
        run: |
          pytest -q \
            tests/test_start_period.py \
            tests/test_state_manager.py \
            tests/test_hash_regression.py

      - name: Start New Evaluation Period
        env:
          STATE_DIR: ./paper_state_dir
        run: |
          python scripts/start_new_period.py

      - name: Audit New Period
        env:
          STATE_DIR: ./paper_state_dir
        run: |
          python scripts/audit_equity.py

      - name: Commit Archived State
        if: success()
        run: |
          set -e

          git config user.name "ApexQuant Bot"
          git config user.email "bot@apexquant.local"

          git add -f -A -- paper_state_dir/

          if ! git diff --staged --quiet; then
            git commit -m "chore: start safely archived paper evaluation period"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No state changes to commit."
          fi
