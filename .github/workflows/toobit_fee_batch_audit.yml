
name: Toobit Fee Batch Audit (Read Only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toobit-fee-batch-audit
  cancel-in-progress: false

jobs:
  fee-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pytest

      - name: Run offline unit tests
        run: |
          python -m pytest -q tests/test_toobit_fee_batch_audit.py

      - name: Run authenticated read-only fee audit
        env:
          TOOBIT_API_KEY: ${{ secrets.TOOBIT_API_KEY }}
          TOOBIT_API_SECRET: ${{ secrets.TOOBIT_API_SECRET }}
        run: |
          python scripts/toobit_fee_batch_audit.py \
            --whitelist config/crypto_whitelist.json \
            --timeout 15 \
            --out reports/toobit_fee_batch_audit.json

      - name: Upload fee audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toobit-fee-batch-audit-${{ github.run_id }}
          path: reports/toobit_fee_batch_audit.json
          if-no-files-found: warn
          retention-days: 30
