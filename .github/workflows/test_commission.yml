name: Test Commission

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/paper_engine.py'
      - 'scripts/backtest.py'
      - 'scripts/strategy_config.py'
      - 'tests/test_commission.py'
      - '.github/workflows/test_commission.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Run commission tests
        run: python tests/test_commission.py