name: Test Toobit Client

on:
  workflow_dispatch: # فقط اجرای دستی برای جلوگیری از درخواست‌های ناخواسته

permissions:
  contents: read

jobs:
  test-client:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pytest

      - name: Run Offline Mock Tests (12 tests)
        run: pytest -q tests/test_toobit_client.py

      # ✅ مرحله جدید: تست اتصال واقعی
      - name: Run Real Connection Test (Read-Only)
        env:
          TOOBIT_API_KEY: ${{ secrets.TOOBIT_API_KEY }}
          TOOBIT_API_SECRET: ${{ secrets.TOOBIT_API_SECRET }}
        run: python scripts/run_toobit_connection_test.py