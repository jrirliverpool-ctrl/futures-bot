name: Test Toobit Client

on:
  push:            # ✅ این خط باعث می‌شود با هر تغییر خودکار اجرا شود
  workflow_dispatch: # این هم برای اجرای دستی باقی می‌ماند

jobs:
  test-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pytest
      - run: pytest -q tests/test_toobit_client.py