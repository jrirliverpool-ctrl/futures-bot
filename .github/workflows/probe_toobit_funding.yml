
name: Toobit Funding Quality Probe

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Maximum pages to fetch per symbol"
        required: true
        default: "10"
        type: string
      page_limit:
        description: "Records per API page"
        required: true
        default: "1000"
        type: string

permissions:
  contents: read

concurrency:
  group: toobit-funding-quality-probe
  cancel-in-progress: false

jobs:
  funding-quality:
    name: Read-only Funding Quality Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pytest

      - name: Validate workflow inputs
        shell: bash
        run: |
          python - <<'PY'
          import os

          max_pages = int(os.environ["MAX_PAGES"])
          page_limit = int(os.environ["PAGE_LIMIT"])

          if not 1 <= max_pages <= 100:
              raise SystemExit("max_pages must be between 1 and 100")

          if not 1 <= page_limit <= 1000:
              raise SystemExit("page_limit must be between 1 and 1000")

          print(f"max_pages={max_pages}")
          print(f"page_limit={page_limit}")
          PY
        env:
          MAX_PAGES: ${{ inputs.max_pages }}
          PAGE_LIMIT: ${{ inputs.page_limit }}

      - name: Run funding quality tests
        run: |
          python -m pytest -q tests/test_funding_quality.py

      - name: Prepare reports directory
        run: mkdir -p reports/funding

      - name: Probe all configured symbols
        id: probe
        shell: bash
        env:
          MAX_PAGES: ${{ inputs.max_pages }}
          PAGE_LIMIT: ${{ inputs.page_limit }}
        run: |
          set +e

          symbols=(
            ADA-SWAP-USDT
            AVAX-SWAP-USDT
            BNB-SWAP-USDT
            BTC-SWAP-USDT
            DOGE-SWAP-USDT
            DOT-SWAP-USDT
            ETH-SWAP-USDT
            LINK-SWAP-USDT
            SOL-SWAP-USDT
            XRP-SWAP-USDT
          )

          failures=0

          for symbol in "${symbols[@]}"; do
            echo "::group::Funding probe: ${symbol}"

            python scripts/probe_toobit_funding.py \
              --symbol "${symbol}" \
              --limit "${PAGE_LIMIT}" \
              --max-pages "${MAX_PAGES}" \
              --output "reports/funding/${symbol}.json"

            exit_code=$?

            if [ "${exit_code}" -ne 0 ]; then
              echo "::error::Funding probe failed for ${symbol}; exit code ${exit_code}"
              failures=$((failures + 1))
            fi

            echo "::endgroup::"
          done

          echo "failures=${failures}" >> "${GITHUB_OUTPUT}"

          if [ "${failures}" -ne 0 ]; then
            echo "::error::${failures} funding probe(s) failed quality or collection checks."
            exit 1
          fi

      - name: Build portfolio funding summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report_dir = Path("reports/funding")
          reports = []

          for path in sorted(report_dir.glob("*.json")):
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
                  reports.append({
                      "file": path.name,
                      "symbol": data.get("symbol", path.stem),
                      "endpoint_ok": data.get("endpoint_ok"),
                      "data_quality_usable": data.get("data_quality_usable"),
                      "collection_complete": data.get("collection_complete"),
                      "stop_reason": data.get("stop_reason"),
                      "record_count": data.get("record_count"),
                      "quality": data.get("quality"),
                  })
              except Exception as exc:
                  reports.append({
                      "file": path.name,
                      "report_read_error": str(exc),
                  })

          summary = {
              "report_count": len(reports),
              "reports": reports,
          }

          report_dir.mkdir(parents=True, exist_ok=True)
          (report_dir / "summary.json").write_text(
              json.dumps(summary, indent=2, ensure_ascii=False),
              encoding="utf-8",
          )

          print(json.dumps(summary, indent=2, ensure_ascii=False))
          PY

      - name: Upload funding audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toobit-funding-quality-${{ github.run_number }}
          path: reports/funding/
          if-no-files-found: warn
          retention-days: 30
