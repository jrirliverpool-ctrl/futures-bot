
name: Toobit Funding Quality Probe

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Maximum pages to fetch per symbol"
        required: true
        default: "10"
        type: string

      page_limit:
        description: "Records per API page"
        required: true
        default: "1000"
        type: string

      min_internal_coverage:
        description: "Minimum internal funding coverage required for backtest eligibility (%)"
        required: true
        default: "99.5"
        type: string

permissions:
  contents: read

concurrency:
  group: toobit-funding-quality-probe
  cancel-in-progress: false

jobs:
  funding-quality:
    name: Read-only Funding Quality Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pytest

      - name: Validate workflow inputs
        shell: bash
        env:
          MAX_PAGES: ${{ inputs.max_pages }}
          PAGE_LIMIT: ${{ inputs.page_limit }}
          MIN_COVERAGE: ${{ inputs.min_internal_coverage }}
        run: |
          python - <<'PY'
          import math
          import os

          max_pages = int(os.environ["MAX_PAGES"])
          page_limit = int(os.environ["PAGE_LIMIT"])
          min_coverage = float(os.environ["MIN_COVERAGE"])

          if not 1 <= max_pages <= 100:
              raise SystemExit(
                  "max_pages must be between 1 and 100"
              )

          if not 1 <= page_limit <= 1000:
              raise SystemExit(
                  "page_limit must be between 1 and 1000"
              )

          if (
              not math.isfinite(min_coverage)
              or not 0 <= min_coverage <= 100
          ):
              raise SystemExit(
                  "min_internal_coverage must be between 0 and 100"
              )

          print(f"max_pages={max_pages}")
          print(f"page_limit={page_limit}")
          print(f"min_internal_coverage={min_coverage}")
          PY

      - name: Run funding quality tests
        run: |
          python -m pytest -q tests/test_funding_quality.py

      - name: Prepare reports directory
        run: mkdir -p reports/funding

      - name: Probe all configured symbols
        id: probe
        shell: bash
        env:
          MAX_PAGES: ${{ inputs.max_pages }}
          PAGE_LIMIT: ${{ inputs.page_limit }}
          MIN_COVERAGE: ${{ inputs.min_internal_coverage }}
        run: |
          set +e

          symbols=(
            ADA-SWAP-USDT
            AVAX-SWAP-USDT
            BNB-SWAP-USDT
            BTC-SWAP-USDT
            DOGE-SWAP-USDT
            DOT-SWAP-USDT
            ETH-SWAP-USDT
            LINK-SWAP-USDT
            SOL-SWAP-USDT
            XRP-SWAP-USDT
          )

          endpoint_failures=0
          ineligible_symbols=()

          for symbol in "${symbols[@]}"; do
            echo "::group::Funding probe: ${symbol}"

            python scripts/probe_toobit_funding.py \
              --symbol "${symbol}" \
              --limit "${PAGE_LIMIT}" \
              --max-pages "${MAX_PAGES}" \
              --min-internal-coverage "${MIN_COVERAGE}" \
              --out "reports/funding/${symbol}.json"

            exit_code=$?

            if [ "${exit_code}" -ne 0 ]; then
              echo "::error::Funding endpoint probe failed for ${symbol}; exit code ${exit_code}"
              endpoint_failures=$((endpoint_failures + 1))

            elif ! python -c 'import json,sys; d=json.load(open(sys.argv[1])); sys.exit(0 if d.get("backtest_eligible") else 1)' \
              "reports/funding/${symbol}.json"; then

              ineligible_symbols+=("${symbol}")

              echo "::warning::${symbol} is not backtest-eligible; see its report reasons."
            fi

            echo "::endgroup::"
          done

          echo "endpoint_failures=${endpoint_failures}" >> "${GITHUB_OUTPUT}"
          echo "ineligible_count=${#ineligible_symbols[@]}" >> "${GITHUB_OUTPUT}"

          printf 'ineligible_symbols=%s\n' \
            "${ineligible_symbols[*]}" >> "${GITHUB_OUTPUT}"

          if [ "${endpoint_failures}" -ne 0 ]; then
            echo "::error::${endpoint_failures} funding endpoint probe(s) failed."
            exit 1
          fi

      - name: Build portfolio funding summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report_dir = Path("reports/funding")
          report_dir.mkdir(parents=True, exist_ok=True)

          reports = []

          for path in sorted(report_dir.glob("*.json")):
              if path.name == "summary.json":
                  continue

              try:
                  data = json.loads(
                      path.read_text(encoding="utf-8")
                  )

                  quality = data.get("quality") or {}
                  counts = quality.get("record_counts") or {}
                  eligibility = (
                      data.get("backtest_eligibility") or {}
                  )

                  reports.append({
                      "file": path.name,
                      "symbol": data.get("symbol", path.stem),
                      "endpoint_ok": data.get("endpoint_ok"),
                      "data_quality_usable": data.get(
                          "data_quality_usable"
                      ),
                      "backtest_eligible": data.get(
                          "backtest_eligible"
                      ),
                      "eligibility_reasons": eligibility.get(
                          "reasons", []
                      ),
                      "eligibility_scope": eligibility.get(
                          "eligibility_scope"
                      ),
                      "historical_boundary_known": eligibility.get(
                          "historical_boundary_known"
                      ),
                      "collection_complete": data.get(
                          "collection_complete"
                      ),
                      "stop_reason": (
                          data.get("pagination") or {}
                      ).get("stop_reason"),
                      "unique_settlements": counts.get(
                          "unique_settlements"
                      ),
                      "period": quality.get("period"),
                      "coverage": quality.get("coverage"),
                      "quality_status": quality.get("status"),
                  })

              except Exception as exc:
                  reports.append({
                      "file": path.name,
                      "report_read_error": str(exc),
                      "backtest_eligible": False,
                  })

          eligible_count = sum(
              item.get("backtest_eligible") is True
              for item in reports
          )

          ineligible = [
              item.get("symbol", item.get("file"))
              for item in reports
              if item.get("backtest_eligible") is not True
          ]

          summary = {
              "schema_version": "2.0",
              "report_count": len(reports),
              "backtest_eligible_count": eligible_count,
              "backtest_ineligible_count": len(ineligible),
              "backtest_ineligible_symbols": ineligible,
              "status": (
                  "reports_available"
                  if reports
                  else "no_symbol_reports_generated"
              ),
              "important_note": (
                  "Eligibility applies only to the observed internal "
                  "history when historical_boundary_known is false; "
                  "it does not prove full contract history."
              ),
              "reports": reports,
          }

          (report_dir / "summary.json").write_text(
              json.dumps(
                  summary,
                  indent=2,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )

          print(json.dumps(
              summary,
              indent=2,
              ensure_ascii=False,
          ))
          PY

      - name: Upload funding audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toobit-funding-quality-${{ github.run_number }}
          path: reports/funding/
          if-no-files-found: warn
          retention-days: 30
