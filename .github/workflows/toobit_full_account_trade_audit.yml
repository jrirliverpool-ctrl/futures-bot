
name: Toobit Full Account Trade Audit (Read Only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toobit-full-account-trade-audit
  cancel-in-progress: false

jobs:
  full-account-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pytest

      - name: Run offline tests
        run: |
          python -m pytest -q \
            tests/test_toobit_full_account_trade_audit.py \
            tests/test_toobit_trade_pagination.py \
            tests/test_fill_ledger.py

      - name: Run authenticated read-only audit
        env:
          TOOBIT_API_KEY: ${{ secrets.TOOBIT_API_KEY }}
          TOOBIT_API_SECRET: ${{ secrets.TOOBIT_API_SECRET }}
        run: |
          python scripts/toobit_full_account_trade_audit.py \
            --whitelist config/crypto_whitelist.json \
            --page-size 1000 \
            --max-pages 100 \
            --ledger reports/toobit_fill_ledger.jsonl \
            --out reports/toobit_full_account_trade_audit.json

      - name: Upload audit report and fill ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toobit-full-account-audit-${{ github.run_id }}
          path: |
            reports/toobit_full_account_trade_audit.json
            reports/toobit_fill_ledger.jsonl
          if-no-files-found: warn
          retention-days: 30
