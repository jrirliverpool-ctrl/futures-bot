name: Run All Project Tests

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-and-accounting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests pytest pandas numpy

      - name: Run Tests
        run: |
          python -m pytest tests/ -q --tb=short --ignore=tests/test_backtest.py --ignore=tests/test_chain_integration.py --ignore=tests/test_paper_engine.py --ignore=tests/test_paper_state_manager.py --ignore=tests/test_state_manager.py