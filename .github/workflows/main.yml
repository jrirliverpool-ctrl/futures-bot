        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests pytest pandas numpy
      - run: pytest -q tests/test_strategy_to_execution.py tests/test_performance.py

  reconciler-and-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests pytest pandas numpy
      - run: pytest -q tests/test_reconciler.py tests/test_reconcile_with_data.py tests/test_paper_status.py tests/test_nan_validation.py