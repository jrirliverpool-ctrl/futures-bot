name: Run All Project Tests

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  core-data-probes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests pytest pandas numpy
      - run: pytest -q tests/test_data_feed.py tests/test_binance_feed.py tests/test_indicators.py tests/test_probe_history.py tests/test_probe_known_gaps.py

  strategy-and-hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests pytest pandas numpy
      - run: pytest -q tests/test_strategy.py tests/test_strategy_config.py tests/test_compute_hash.py tests/test_hash_regression.py tests/test_strategy_hash_contract.py tests/test_state_hash_strict.py

  paper-and-commission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests pytest pandas numpy
      # تست جدید test_accounting اضافه شد و تست‌های خراب حذف شدند
      - run: pytest -q tests/test_commission.py tests/test_funding.py tests/test_run_paper_wiring.py tests/test_paper_catchup.py tests/test_accounting.py

  execution-and-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests pytest pandas numpy
      - run: pytest -q tests/test_signal_to_order.py tests/test_order_executor.py tests/test_execution_manager.py tests/test_execution_chain.py tests/test_kill_switch.py

  backtest-and-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
