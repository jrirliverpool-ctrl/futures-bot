name: Verify Gaps

on:
  workflow_dispatch:

jobs:
  verify:
    name: Verify gaps from long probe
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Download latest long report artifact
        run: |
          mkdir -p reports
          # گزارش probe_long.json باید قبلاً در مخزن یا artifact باشد.
          # اینجا فرض می‌کنیم در کنار مخزن داری. اگر نداری، ابتدا Probe long را دوباره اجرا کن.

      - name: Run verify_gaps
        run: |
          python scripts/verify_gaps.py \
            --gaps-from reports/probe_long.json \
            --out reports/verify_gaps_report.json

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-gaps-report
          path: reports/verify_gaps_report.json
          if-no-files-found: warn
          retention-days: 30