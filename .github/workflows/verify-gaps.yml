name: Verify Gaps

on:
  workflow_dispatch:

jobs:
  verify:
    name: Fetch long range + verify gaps
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Probe long — regenerate report
        run: |
          mkdir -p reports
          python scripts/probe_binance_history.py \
            --mode long \
            --out reports/probe_long.json || true
          # || true چون Probe ممکن است exit 1 بدهد (به‌خاطر gap)
          # ولی گزارش JSON را نوشته است.

      - name: Verify each gap independently
        run: |
          python scripts/verify_gaps.py \
            --gaps-from reports/probe_long.json \
            --out reports/verify_gaps_report.json

      - name: Upload both reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-gaps-artifacts
          path: |
            reports/probe_long.json
            reports/verify_gaps_report.json
          if-no-files-found: warn
          retention-days: 30
