name: Research - Donchian Sweep

on:
  workflow_dispatch:
    inputs:
      candle_limit:
        description: "Requested number of closed candles"
        required: true
        default: "1000"
        type: string

permissions:
  contents: read

jobs:
  donchian-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install required dependency
        run: python -m pip install requests

      - name: Run controlled Donchian comparison
        run: python scripts/sweep_donchian.py "${{ inputs.candle_limit }}"

      - name: Upload comparison reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: donchian-sweep-results
          path: artifacts/donchian_sweep.*
          if-no-files-found: warn
          retention-days: 14