name: Sweep Donchian Parameters

on:
  workflow_dispatch: # فقط به صورت دستی اجرا می‌شود تا منابع هدر نرود

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # بک‌تست ممکن است چند دقیقه طول بکشد

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Donchian Sweep
        env:
          SYMBOL: BTC-SWAP-USDT
          INTERVAL: 1h
        run: python scripts/sweep_donchian.py