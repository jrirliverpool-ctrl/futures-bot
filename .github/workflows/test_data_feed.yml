name: Data Feed Unit Tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/data_feed.py'
      - 'tests/test_data_feed.py'
      - '.github/workflows/test_data_feed.yml'

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Data Feed Unit Tests
        run: python tests/test_data_feed.py