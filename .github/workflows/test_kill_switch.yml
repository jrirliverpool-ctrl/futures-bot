name: Kill Switch Unit Tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/kill_switch.py'
      - 'tests/test_kill_switch.py'
      - '.github/workflows/test_kill_switch.yml'
  pull_request:
    paths:
      - 'scripts/kill_switch.py'
      - 'tests/test_kill_switch.py'
      - '.github/workflows/test_kill_switch.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Python syntax
        run: python -m py_compile scripts/kill_switch.py tests/test_kill_switch.py

      - name: Run Kill Switch tests
        run: python tests/test_kill_switch.py