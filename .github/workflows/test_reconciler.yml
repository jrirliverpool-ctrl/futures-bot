name: Reconciler Unit Tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/reconciler.py'
      - 'scripts/data_feed.py'
      - 'scripts/paper_state_manager.py'
      - 'scripts/state_manager.py'
      - 'scripts/compute_hash.py'
      - 'scripts/strategy_config.py'
      - 'tests/test_reconciler.py'
      - '.github/workflows/test_reconciler.yml'
  pull_request:
    paths:
      - 'scripts/reconciler.py'
      - 'scripts/data_feed.py'
      - 'scripts/paper_state_manager.py'
      - 'scripts/state_manager.py'
      - 'scripts/compute_hash.py'
      - 'scripts/strategy_config.py'
      - 'tests/test_reconciler.py'
      - '.github/workflows/test_reconciler.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install requests

      - name: Run Reconciler tests
        run: python tests/test_reconciler.py