name: Strategy Unit Tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/strategy.py'
      - 'tests/test_strategy.py'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run strategy tests
        run: python tests/test_strategy.py