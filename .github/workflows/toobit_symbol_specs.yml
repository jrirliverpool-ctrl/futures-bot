name: Toobit Symbol Specs Validation

on:
  workflow_dispatch:

jobs:
  specs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run symbol specs test
        run: python scripts/symbol_specs.py