name: Research - OOS Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oos-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install required dependency
        run: python -m pip install requests

      - name: Run OOS Validation
        run: python scripts/sweep_oos.py