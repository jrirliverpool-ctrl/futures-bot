name: Audit Equity & Candle Sequence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Candle Sequence Verification
        env:
          STATE_DIR: ./paper_state_dir
        run: python scripts/verify_candle_sequence.py

      - name: Run Equity Audit
        env:
          STATE_DIR: ./paper_state_dir
        run: python scripts/audit_equity.py