
name: Toobit Private Read-Only Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install requests pytest

      - name: Run Toobit protection safety tests
        run: python -m pytest -q tests/test_toobit_protection.py

      - name: Run read-only preflight unit tests
        run: python -m unittest discover -s tests -p 'test_toobit_readonly_preflight.py' -v

      - name: Run read-only account preflight
        env:
          TOOBIT_API_KEY: ${{ secrets.TOOBIT_API_KEY }}
          TOOBIT_API_SECRET: ${{ secrets.TOOBIT_API_SECRET }}
        run: python scripts/toobit_readonly_preflight.py
