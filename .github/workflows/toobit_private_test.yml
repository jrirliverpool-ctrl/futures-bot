
name: Toobit Private Read-Only Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest requests

      - name: Run capital feasibility tests
        env:
          PYTHONPATH: scripts
        run: |
          pytest -q tests/test_toobit_capital_feasibility.py

      - name: Run related safety tests
        env:
          PYTHONPATH: scripts
        run: |
          pytest -q tests/test_symbol_specs.py
