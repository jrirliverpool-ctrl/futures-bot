name: Toobit Market Data Test

on:
  workflow_dispatch:

jobs:
  test_klines:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run klines test
        run: python scripts/fetch_klines.py