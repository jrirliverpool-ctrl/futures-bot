
name: ApexQuant V1 Paper State Migration

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apexquant-mock-live
  cancel-in-progress: false

jobs:
  migrate-v1-state:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests

      - name: Run Migration Safety Tests
        run: |
          pytest -q \
            tests/test_migrate_paper_state.py \
            tests/test_hash_regression.py \
            tests/test_strategy_config.py \
            tests/test_state_manager.py

      - name: Migrate V1 Paper State
        run: |
          python scripts/migrate_paper_state_v1_0_1_to_v1_1_0.py \
            --state-dir ./paper_state_dir

      - name: Commit Migration and Backup
        if: success()
        run: |
          set -e

          git config user.name "ApexQuant Migration Bot"
          git config user.email "migration@apexquant.local"

          git add -f -- \
            paper_state_dir/state.json \
            paper_state_dir/state.json.pre_migration_1.0.1_to_1.1.0.bak \
            paper_state_dir/migration_1.0.1_to_1.1.0.json

          if ! git diff --staged --quiet; then
            git commit -m "chore: migrate V1 paper state to strategy 1.1.0"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No migration changes to commit."
          fi
