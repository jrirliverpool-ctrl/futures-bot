name: ApexQuant Toobit V2 Decimal Order Adapter Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/toobit_v2_order_adapter.py'
      - 'tests/test_toobit_v2_order_adapter.py'
      - '.github/workflows/toobit_v2_order_adapter_tests.yml'

permissions:
  contents: read

jobs:
  toobit-v2-order-adapter:
    name: V2 JSON signing and decimal contract quantities
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check requests pytest

      - name: Run isolated V2 adapter tests
        env:
          PYTHONPATH: scripts
        run: python -m pytest -q tests/test_toobit_v2_order_adapter.py