name: ApexQuant Toobit V2 Adapter and Safety Regression

on:
  workflow_dispatch:

  push:
    paths:
      - 'scripts/toobit_v2_order_adapter.py'
      - 'scripts/order_recovery_probe.py'
      - 'scripts/toobit_trade_pagination.py'
      - 'scripts/order_intent_store.py'
      - 'scripts/fill_ledger.py'
      - 'scripts/execution_manager.py'
      - 'scripts/order_executor.py'
      - 'scripts/toobit_readonly_preflight.py'
      - 'scripts/toobit_live_readiness_gate.py'
      - 'scripts/toobit_readonly_reconciliation.py'
      - 'scripts/toobit_capital_feasibility.py'
      - 'scripts/live_execution_state.py'
      - 'tests/**'
      - '.github/workflows/toobit_v2_order_adapter_tests.yml'

  pull_request:
    paths:
      - 'scripts/toobit_v2_order_adapter.py'
      - 'scripts/order_recovery_probe.py'
      - 'scripts/toobit_trade_pagination.py'
      - 'scripts/order_intent_store.py'
      - 'scripts/fill_ledger.py'
      - 'scripts/execution_manager.py'
      - 'scripts/order_executor.py'
      - 'scripts/toobit_readonly_preflight.py'
      - 'scripts/toobit_live_readiness_gate.py'
      - 'scripts/toobit_readonly_reconciliation.py'
      - 'scripts/toobit_capital_feasibility.py'
      - 'scripts/live_execution_state.py'
      - 'tests/**'
      - '.github/workflows/toobit_v2_order_adapter_tests.yml'

permissions:
  contents: read

jobs:
  api-and-execution-safety:
    name: API, recovery, accounting and risk regression
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests pytest

      - name: Run V2 adapter and execution safety regression
        env:
          PYTHONPATH: scripts
        run: |
          python -m pytest -q \
            tests/test_toobit_v2_order_adapter.py \
            tests/test_toobit_client.py \
            tests/test_toobit_v2_readonly.py \
            tests/test_order_recovery_probe.py \
            tests/test_toobit_trade_pagination.py \
            tests/test_order_intent_store.py \
            tests/test_fill_ledger.py \
            tests/test_fill_ledger_v2.py \
            tests/test_execution_manager.py \
            tests/test_order_executor.py \
            tests/test_portfolio_risk.py \
            tests/test_callback_decision_propagation.py \
            tests/test_toobit_readonly_preflight.py \
            tests/test_toobit_live_readiness_gate.py \
            tests/test_toobit_readonly_reconciliation.py \
            tests/test_toobit_capital_feasibility.py \
            tests/test_live_execution_state.py \
            tests/test_toobit_full_account_trade_audit.py