name: Mock Live V2 (Manual — with persistence)

# PERSISTENCE DESIGN:
#   - Always operates on `main`.
#   - After checkout, force-syncs with origin/main (git reset --hard).
#   - `git add -f state.json` overrides .gitignore (V1 does the same with -f).
#   - Backups (state.json.bak.*) are blocked by .gitignore.
#   - No git pull --rebase: if push conflicts, FAIL LOUDLY. The next run
#     will start from the newly-committed origin/main state.
#   - V1 (paper_state_dir/) is NEVER staged, committed, or touched.
#
# CRON IS DISABLED. Enable only after:
#   1. Two consecutive manual runs (>=60s gap) prove state advances.
#   2. state.json is verified present in main after first run.
#   3. Failure modes verified (push fail → no silent advance).

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mock-live-v2
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Verify branch is main
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "❌ Must run on 'main'. Got: ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync with origin/main
        run: |
          git fetch origin main
          local_sha=$(git rev-parse HEAD)
          remote_sha=$(git rev-parse origin/main)
          echo "Local HEAD:  $local_sha"
          echo "origin/main: $remote_sha"
          if [ "$local_sha" != "$remote_sha" ]; then
            echo "⚠️  Local != origin/main — resetting"
            git reset --hard origin/main
          fi
          echo "✅ HEAD: $(git rev-parse --short HEAD)"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytest

      - name: Capture pre-run snapshot
        id: pre
        run: |
          if [ -f multi_symbol_state_dir/state.json ]; then
            echo "STATE_PRESENT=true" >> "$GITHUB_OUTPUT"
            python3 <<'PYEOF' >> "$GITHUB_OUTPUT"
          import json
          s = json.loads(open("multi_symbol_state_dir/state.json").read())
          print(f"PRE_EQUITY={s.get('equity')}")
          lpcts = [v.get("last_processed_candle_ts") for v in s.get("symbols", {}).values()
                   if v.get("last_processed_candle_ts") is not None]
          if lpcts:
              print(f"PRE_MIN_LPCT={min(lpcts)}")
              print(f"PRE_MAX_LPCT={max(lpcts)}")
          else:
              print("PRE_MIN_LPCT=None")
              print("PRE_MAX_LPCT=None")
          PYEOF
          else
            echo "STATE_PRESENT=false" >> "$GITHUB_OUTPUT"
            echo "PRE_EQUITY=absent" >> "$GITHUB_OUTPUT"
            echo "PRE_MIN_LPCT=None" >> "$GITHUB_OUTPUT"
            echo "PRE_MAX_LPCT=None" >> "$GITHUB_OUTPUT"
          fi

      - name: Run V2 cycle
        id: run
        env:
          STATE_DIR: ./multi_symbol_state_dir
          INTERVAL: "1h"
        run: python scripts/run_multi_symbol.py

      - name: Validate state — strict
        id: validate
        run: |
          python3 <<'PYEOF'
          import json, math, sys
          from pathlib import Path

          STATE_PATH = Path("multi_symbol_state_dir/state.json")
          WL_PATH = Path("config/crypto_whitelist.json")

          def fail(msg):
              print(f"❌ VALIDATION FAIL: {msg}")
              sys.exit(1)

          if not STATE_PATH.exists(): fail("state.json missing")
          try: s = json.loads(STATE_PATH.read_text())
          except json.JSONDecodeError as e: fail(f"invalid JSON: {e}")
          try: expected = set(json.loads(WL_PATH.read_text())["symbols"])
          except Exception as e: fail(f"whitelist: {e}")

          if s.get("version") != "2.0.0": fail(f"version={s.get('version')}")
          if s.get("schema") != "multi_symbol_v1": fail(f"schema={s.get('schema')}")

          for k in ("initial_equity", "equity", "peak_equity"):
              v = s.get(k)
              if isinstance(v, bool) or not isinstance(v, (int, float)): fail(f"{k} type")
              if not math.isfinite(v): fail(f"{k} not finite")
              if v < 0: fail(f"{k} negative")
          if s["peak_equity"] < s["initial_equity"]: fail("peak < initial")

          syms = s.get("symbols")
          if not isinstance(syms, dict): fail("symbols not dict")
          if set(syms.keys()) != expected: fail(f"symbol mismatch: {set(syms.keys()) ^ expected}")

          req = {"last_processed_candle_ts", "cooldown_until_index",
                 "pending_entry", "position", "last_funding_ts"}
          for sym, ss in syms.items():
              if not isinstance(ss, dict): fail(f"{sym} not dict")
              if req - set(ss.keys()): fail(f"{sym} missing: {req - set(ss.keys())}")
              if ss.get("position") is not None and ss.get("pending_entry") is not None:
                  fail(f"{sym} position+pending")

          mcp = s.get("max_concurrent_positions")
          if isinstance(mcp, bool) or not isinstance(mcp, int) or mcp < 1: fail(f"mcp={mcp!r}")
          reserved = sum(1 for ss in syms.values()
                        if ss.get("position") is not None or ss.get("pending_entry") is not None)
          if reserved > mcp: fail(f"capacity {reserved}>{mcp}")

          print(f"✅ State valid: {len(syms)} symbols, equity={s['equity']}")
          PYEOF

      - name: Verify no LPCT regression
        if: steps.pre.outputs.STATE_PRESENT == 'true'
        run: |
          python3 <<'PYEOF'
          import json, subprocess, sys
          try:
              pre_raw = subprocess.check_output(
                  ["git", "show", "HEAD:multi_symbol_state_dir/state.json"],
                  stderr=subprocess.DEVNULL,
              ).decode()
              pre = json.loads(pre_raw)
          except subprocess.CalledProcessError:
              print("⚠️  No committed state.json at HEAD — skipping regression check")
              sys.exit(0)

          post = json.loads(open("multi_symbol_state_dir/state.json").read())
          regressions = []
          for sym, ps in pre.get("symbols", {}).items():
              pl = ps.get("last_processed_candle_ts")
              ql = post.get("symbols", {}).get(sym, {}).get("last_processed_candle_ts")
              if pl is not None and ql is not None and ql < pl:
                  regressions.append((sym, pl, ql))
          if regressions:
              for r in regressions: print(f"❌ regression {r}")
              sys.exit(1)
          print("✅ No LPCT regression")
          PYEOF

      - name: Commit state
        id: commit
        run: |
          git config user.name "ApexQuant Bot"
          git config user.email "apexquant-bot@users.noreply.github.com"

          # Stage all V2 files, BUT force-add state.json to override .gitignore.
          # This is the exact same pattern V1 uses: `git add -f`.
          git add multi_symbol_state_dir/
          git add -f multi_symbol_state_dir/state.json

          # Defensive: unstage any .bak that somehow got staged
          git reset -q -- multi_symbol_state_dir/state.json.bak.* 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "COMMITTED=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(v2): auto-update multi-symbol state [skip ci]"
            echo "COMMITTED=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push to main (fail-closed, no rebase)
        if: steps.commit.outputs.COMMITTED == 'true'
        run: |
          if [ "$(git rev-parse --abbrev-ref HEAD)" != "main" ]; then
            echo "❌ Not on main — aborting"; exit 1
          fi

          if ! git push origin main; then
            echo "❌ PUSH FAILED — state NOT persisted."
            echo "   Local state exists only in artifact below."
            echo "   Next run will start from last committed state on origin/main."
            exit 1
          fi
          echo "✅ State pushed to main"

      - name: Verify state.json is tracked in HEAD
        if: steps.commit.outputs.COMMITTED == 'true'
        run: |
          if git ls-tree -r HEAD --name-only | grep -q "^multi_symbol_state_dir/state.json$"; then
            echo "✅ state.json is tracked in HEAD"
          else
            echo "❌ state.json NOT in HEAD tree — persistence is broken"
            exit 1
          fi

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-state-${{ github.run_id }}
          path: multi_symbol_state_dir/
          if-no-files-found: ignore
          retention-days: 7

      - name: Show summary
        if: always()
        run: |
          echo "## Mock Live V2 Run" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Pre-run" >> "$GITHUB_STEP_SUMMARY"
          echo "- State existed: \`${{ steps.pre.outputs.STATE_PRESENT }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Equity: \`${{ steps.pre.outputs.PRE_EQUITY }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Min LPCT: \`${{ steps.pre.outputs.PRE_MIN_LPCT }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Max LPCT: \`${{ steps.pre.outputs.PRE_MAX_LPCT }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Steps" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run: \`${{ steps.run.outcome }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Validate: \`${{ steps.validate.outcome }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ steps.commit.outputs.COMMITTED }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f multi_symbol_state_dir/state.json ]; then
            python3 <<'PYEOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          s = json.loads(open("multi_symbol_state_dir/state.json").read())
          print(f"### Post-run equity: {s['equity']}")
          print()
          print("| Symbol | last_processed |")
          print("|---|---|")
          for sym, ss in s.get("symbols", {}).items():
              print(f"| {sym} | {ss.get('last_processed_candle_ts')} |")
          lpcts = [v.get('last_processed_candle_ts') for v in s['symbols'].values()
                   if v.get('last_processed_candle_ts')]
          if lpcts:
              print()
              print(f"- Min LPCT: {min(lpcts)}")
              print(f"- Max LPCT: {max(lpcts)}")
          PYEOF
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Cron:** disabled." >> "$GITHUB_STEP_SUMMARY"