name: Binance History Probe

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ============================================================
  # Job 1 — Probe کوتاه (خودکار روی هر push/PR)
  # اگر داده ناقص باشد، job شکست می‌خورد.
  # گزارش حتی در صورت شکست آپلود می‌شود.
  # ============================================================
  probe-short:
    name: Probe history — short
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Unit tests — binance_feed
        run: python tests/test_binance_feed.py

      - name: Unit tests — probe_history
        run: python tests/test_probe_history.py

      - name: Probe live — connectivity
        run: python scripts/probe_binance_live.py

      - name: Probe history — short (~6 months)
        run: |
          mkdir -p reports
          python scripts/probe_binance_history.py \
            --mode short \
            --out reports/probe_short.json

      - name: Upload short report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-history-short
          path: reports/probe_short.json
          if-no-files-found: warn
          retention-days: 30

  # ============================================================
  # Job 2 — Probe بلند (فقط دستی، و فقط اگر job کوتاه موفق بود)
  # ============================================================
  probe-long:
    name: Probe history — long (2019 → now)
    runs-on: ubuntu-latest
    needs: [probe-short]
    if: >-
      github.event_name == 'workflow_dispatch'
      && needs.probe-short.result == 'success'
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Probe history — long (2019-01-01 → now)
        run: |
          mkdir -p reports
          python scripts/probe_binance_history.py \
            --mode long \
            --out reports/probe_long.json

      - name: Upload long report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-history-long
          path: reports/probe_long.json
          if-no-files-found: warn
          retention-days: 90