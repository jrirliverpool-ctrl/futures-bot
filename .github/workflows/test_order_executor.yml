name: Order Executor Contract Tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/order_executor.py'
      - 'tests/test_order_executor.py'
      - '.github/workflows/test_order_executor.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Order Executor tests
        run: python tests/test_order_executor.py