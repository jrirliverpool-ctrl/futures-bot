name: ApexQuant Mock Live Runner

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 * * * *'

permissions:
  contents: write

concurrency:
  group: apexquant-mock-live
  cancel-in-progress: false

jobs:
  run-mock-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # ✅ ۱. محدودیت شاخه: فقط در main اجرا می‌شود
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytest

      # ✅ ۲. اجرای تست‌های ایمنی قبل از موتور
      - name: Run Safety Tests
        run: |
          pytest -q tests/test_execution_manager.py tests/test_order_executor.py tests/test_kill_switch.py

      - name: Run Mock Live Engine
        env:
          STATE_DIR: ./paper_state_dir
          SYMBOL: BTC-SWAP-USDT
          INTERVAL: 1h
        run: python scripts/run_mock_live.py

      - name: Commit State Updates
        if: success()
        run: |
          set -e
          
          git config user.name "ApexQuant Bot"
          git config user.email "bot@apexquant.local"

          # بررسی وجود فایل
          test -f paper_state_dir/state.json
          
          # اضافه کردن فایل‌ها به صورت اجباری (چون در gitignore هستند)
          git add -f paper_state_dir/state.json
          
          if [ -f paper_state_dir/events.jsonl ]; then
            git add -f paper_state_dir/events.jsonl
          fi

          # اگر تغییری وجود دارد، کامیت و پوش کن
          if ! git diff --staged --quiet; then
            git commit -m "chore: update mock live state [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No state changes to commit."
          fi