name: ApexQuant Mock Live Runner

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

concurrency:
  group: apexquant-mock-live
  cancel-in-progress: false

jobs:
  run-mock-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytest

      - name: Run Safety Tests
        run: |
          pytest -q tests/test_execution_manager.py tests/test_order_executor.py tests/test_kill_switch.py tests/test_tp1_exit.py tests/test_telegram_notifier.py tests/test_mock_live_status.py

      - name: Run Mock Live Engine
        env:
          STATE_DIR: ./paper_state_dir
          SYMBOL: BTC-SWAP-USDT
          INTERVAL: 1h
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/run_mock_live.py

      - name: Commit State Updates
        if: always()
        run: |
          set -e

          git config user.name "ApexQuant Bot"
          git config user.email "bot@apexquant.local"

          git add -f -A -- paper_state_dir/

          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-update mock live state [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No state changes to commit."
          fi