name: ApexQuant Mock Live Runner

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *' # اجرای خودکار در دقیقه 0 هر ساعت (UTC)

permissions:
  contents: write

concurrency:
  group: apexquant-mock-live
  cancel-in-progress: false

jobs:
  run-mock-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytest

      - name: Run Safety Tests
        run: |
          # ✅ اضافه شدن تست جدید TP1 Exit
          pytest -q tests/test_execution_manager.py tests/test_order_executor.py tests/test_kill_switch.py tests/test_tp1_exit.py

      - name: Run Mock Live Engine
        env:
          STATE_DIR: ./paper_state_dir
          SYMBOL: BTC-SWAP-USDT
          INTERVAL: 1h
        run: python scripts/run_mock_live.py

      - name: Commit State Updates
        if: always() # اجرا حتی در صورت شکست برای ذخیره وضعیت failed
        run: |
          set -e
          
          git config user.name "ApexQuant Bot"
          git config user.email "bot@apexquant.local"

          # اضافه کردن تمام تغییرات در پوشه (شامل paper_status.json)
          git add -f -A -- paper_state_dir/
          
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-update mock live state [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No state changes to commit."
          fi