name: ApexQuant Mock Live Runner

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

concurrency:
  group: apexquant-mock-live
  cancel-in-progress: false

jobs:
  run-mock-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytest

      - name: Run Safety Tests
        run: |
          pytest -q \
            tests/test_execution_manager.py \
            tests/test_order_executor.py \
            tests/test_kill_switch.py \
            tests/test_tp1_exit.py \
            tests/test_telegram_notifier.py \
            tests/test_mock_live_status.py \
            tests/test_paper_state_manager.py \
            tests/test_paper_state_atomic.py

      - name: Initialize Telegram Event Baseline
        if: success()
        continue-on-error: true
        env:
          PYTHONPATH: scripts
        run: |
          python - <<'PY'
          from telegram_notifier import initialize_event_baseline

          ok = initialize_event_baseline("./paper_state_dir")

          if ok:
              print("TELEGRAM_BASELINE=READY")
          else:
              print("::warning::Telegram baseline initialization failed.")
          PY

      - name: Run Mock Live Engine
        env:
          STATE_DIR: ./paper_state_dir
          SYMBOL: BTC-SWAP-USDT
          INTERVAL: 1h
          APEX_SAFE_MODE: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/run_mock_live.py

      - name: Dispatch Telegram Trading Events
        if: always()
        continue-on-error: true
        env:
          PYTHONPATH: scripts
          STATE_DIR: ./paper_state_dir
          SYMBOL: BTC-SWAP-USDT
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          from telegram_notifier import notify_pending_events

          state_dir = os.environ.get(
              "STATE_DIR",
              "./paper_state_dir",
          )

          count = notify_pending_events(state_dir)

          print(
              "TELEGRAM_CONFIRMED_EVENT_DELIVERIES="
              f"{count}"
          )
          PY

      - name: Commit State Updates
        if: always()
        run: |
          set -e

          git config user.name "ApexQuant Bot"
          git config user.email "bot@apexquant.local"

          git add -f -A -- paper_state_dir/

          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-update mock live state [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No state changes to commit."
          fi