name: ApexQuant Mock Live Runner

on:
  # ⚠️ در گام اول، فقط اجرای دستی را فعال می‌کنیم
  workflow_dispatch:
  # schedule:
  #   - cron: '0 * * * *'

permissions:
  contents: write

concurrency:
  group: apexquant-mock-live
  cancel-in-progress: false

jobs:
  run-mock-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytest

      - name: Run Mock Live Engine
        env:
          STATE_DIR: ./paper_state_dir
          SYMBOL: BTC-SWAP-USDT
          INTERVAL: 1h
        run: python scripts/run_mock_live.py

      - name: Commit State Updates
        if: success()
        run: |
          git config user.name "ApexQuant Bot"
          git config user.email "bot@apexquant.local"

          # ✅ اصلاح: استفاده از -f برای عبور از .gitignore
          git add -f paper_state_dir/state.json
          
          if [ -f paper_state_dir/events.jsonl ]; then
            git add -f paper_state_dir/events.jsonl
          fi

          if ! git diff --staged --quiet; then
            git commit -m "chore: update mock live state [skip ci]"
            # ✅ کشیدن تغییرات احتمالی دیگران قبل از پوش (جلوگیری از تداخل)
            git pull --rebase origin main || true
            git push
          else
            echo "No state changes to commit."
          fi