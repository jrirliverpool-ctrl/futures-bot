name: Strategy to Execution Integration Tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/indicators.py'
      - 'scripts/strategy.py'
      - 'scripts/signal_to_order.py'
      - 'scripts/order_executor.py'
      - 'tests/test_strategy_to_execution.py'
      - '.github/workflows/test_strategy_to_execution.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Strategy to Execution tests
        run: python tests/test_strategy_to_execution.py