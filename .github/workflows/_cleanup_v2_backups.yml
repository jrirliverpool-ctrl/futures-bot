name: Cleanup V2 state backups (one-time)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Remove .bak files from repo
        run: |
          git config user.name "ApexQuant Bot"
          git config user.email "apexquant-bot@users.noreply.github.com"

          count=$(find multi_symbol_state_dir -name 'state.json.bak.*' | wc -l)
          echo "Found $count .bak files"

          if [ "$count" -gt 0 ]; then
            git rm -f multi_symbol_state_dir/state.json.bak.* || true
            git commit -m "chore(v2): remove state.json.bak.* from repo (keep git history) [skip ci]"
            git push origin main
            echo "✅ Removed $count files"
          else
            echo "Nothing to remove"
          fi