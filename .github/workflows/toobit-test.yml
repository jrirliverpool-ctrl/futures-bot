name: Toobit API Connectivity Test

on:
  workflow_dispatch:

jobs:
  test-toobit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Test Toobit public APIs
        run: |
          python - <<'PY'
          import requests

          tests = [
              (
                  "SERVER TIME",
                  "https://api.toobit.com/en-US/api/v1/time",
                  {}
              ),
              (
                  "FUTURES TICKER",
                  "https://api.toobit.com/en-US/api/v1/quote/v1/contract/ticker/24hr",
                  {"symbol": "BTC-SWAP-USDT"}
              ),
              (
                  "FUTURES PRICE",
                  "https://api.toobit.com/en-US/api/v1/quote/v1/contract/ticker/price",
                  {"symbol": "BTC-SWAP-USDT"}
              ),
          ]

          print("=== TOOBIT PUBLIC API TEST ===")

          passed = 0

          for name, url, params in tests:
              print(f"\n--- {name} ---")
              print("URL:", url)

              try:
                  r = requests.get(
                      url,
                      params=params,
                      timeout=15
                  )

                  print("HTTP STATUS:", r.status_code)
                  print("RESPONSE:", r.text[:1000])

                  if r.ok:
                      passed += 1
                      print("RESULT: OK")
                  else:
                      print("RESULT: FAILED")

              except Exception as e:
                  print("CONNECTION ERROR:", repr(e))

          print(f"\n=== RESULT: {passed}/{len(tests)} TESTS PASSED ===")

          if passed == 0:
              raise SystemExit("All Toobit public API tests failed")

          PY