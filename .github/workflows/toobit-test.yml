name: Toobit API Connectivity Test

on:
  workflow_dispatch:

jobs:
  test-toobit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Test Toobit official public API
        run: |
          python - <<'PY'
          import requests

          BASE = "https://api.toobit.com"

          tests = [
              (
                  "SERVER TIME",
                  f"{BASE}/api/v1/time",
                  {}
              ),
              (
                  "EXCHANGE INFO",
                  f"{BASE}/api/v1/exchangeInfo",
                  {}
              ),
              (
                  "FUTURES TICKER",
                  f"{BASE}/quote/v1/contract/ticker/24hr",
                  {"symbol": "BTC-SWAP-USDT"}
              ),
              (
                  "FUTURES PRICE",
                  f"{BASE}/quote/v1/contract/ticker/price",
                  {"symbol": "BTC-SWAP-USDT"}
              ),
              (
                  "FUTURES MARK PRICE",
                  f"{BASE}/quote/v1/markPrice",
                  {"symbol": "BTC-SWAP-USDT"}
              ),
              (
                  "FUTURES KLINES",
                  f"{BASE}/quote/v1/klines",
                  {
                      "symbol": "BTC-SWAP-USDT",
                      "interval": "1h",
                      "limit": 5
                  }
              ),
          ]

          print("======================================")
          print("      TOOBIT OFFICIAL API TEST")
          print("======================================")

          passed = 0

          for name, url, params in tests:

              print("\n--------------------------------------")
              print(name)
              print("URL:", url)
              print("PARAMS:", params)

              try:
                  r = requests.get(
                      url,
                      params=params,
                      timeout=20
                  )

                  print("HTTP STATUS:", r.status_code)
                  print("RESPONSE:", r.text[:1500])

                  if r.ok:
                      passed += 1
                      print("RESULT: OK")
                  else:
                      print("RESULT: FAILED")

              except Exception as e:
                  print("CONNECTION ERROR:", repr(e))
                  print("RESULT: FAILED")

          print("\n======================================")
          print(f"FINAL RESULT: {passed}/{len(tests)} PASSED")
          print("======================================")

          if passed == 0:
              raise SystemExit("No Toobit public API endpoint responded successfully")

          PY